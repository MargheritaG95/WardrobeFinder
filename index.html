async function doLogin(){
 const btn=$('#login'),email=$('#email').value.trim(),password=$('#password').value;
 $('#authmsg').textContent='';
 if(!email||!password){$('#authmsg').textContent='Inserisci email e password.';return}
 btn.disabled=true;btn.textContent='Accesso…';
 try{
   const {data,error}=await sb.auth.signInWithPassword({email,password});
   if(error)throw error;
   if(!data?.session)throw new Error('Accesso non completato.');
   $('#authmsg').textContent='Accesso riuscito.';
   await enter(data.user);
 }catch(err){
   console.error('Login error',err);
   $('#authmsg').textContent='Errore accesso: '+(err?.message||String(err));
 }finally{
   btn.disabled=false;btn.textContent='Accedi';
 }
}
async function doSignup(){
 const btn=$('#signup'),email=$('#email').value.trim(),password=$('#password').value;
 $('#authmsg').textContent='';
 if(!email||!password){$('#authmsg').textContent='Inserisci email e password.';return}
 btn.disabled=true;
 try{
   const {data,error}=await sb.auth.signUp({email,password});
   if(error)throw error;
   $('#authmsg').textContent=data?.session?'Account creato e accesso effettuato.':'Account creato: controlla la tua email.';
   if(data?.session)await enter(data.user);
 }catch(err){
   console.error('Signup error',err);
   $('#authmsg').textContent='Errore: '+(err?.message||String(err));
 }finally{btn.disabled=false}
}
$('#login').addEventListener('click',doLogin);
$('#signup').addEventListener('click',doSignup);
$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

const signedCache=new Map();
async function surl(p){
 if(!p)return null;
 if(signedCache.has(p))return signedCache.get(p);
 const {data}=await sb.storage.from('foto-vestiti').createSignedUrl(p,86400);
 const u=data?.signedUrl||null;if(u)signedCache.set(p,u);return u
}
function lazyPhotos(){
 const imgs=[...document.querySelectorAll('img[data-photo]')];
 if(!('IntersectionObserver'in window)){imgs.forEach(loadLazy);return}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){loadLazy(e.target);io.unobserve(e.target)}}),{rootMargin:'250px'});
 imgs.forEach(i=>io.observe(i))
}
async function loadLazy(img){if(img.dataset.loaded)return;img.dataset.loaded='1';const u=await surl(img.dataset.photo);if(u){img.src=u;img.onload=()=>img.classList.add('loaded')}}
async function compressImage(file,max=1600,quality=.78){
 if(!file||!file.type.startsWith('image/'))return file;
 const bmp=await createImageBitmap(file),scale=Math.min(1,max/Math.max(bmp.width,bmp.height)),w=Math.max(1,Math.round(bmp.width*scale)),h=Math.max(1,Math.round(bmp.height*scale));
 const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);bmp.close?.();
 return await new Promise(r=>c.toBlob(b=>r(new File([b],(file.name.replace(/\.[^.]+$/,'')||'foto')+'.jpg',{type:'image/jpeg'})),'image/jpeg',quality))
}
async function makeThumb(file){
 const bmp=await createImageBitmap(file),size=320,scale=Math.max(size/bmp.width,size/bmp.height),w=bmp.width*scale,h=bmp.height*scale,x=(size-w)/2,y=(size-h)/2;
 const c=document.createElement('canvas');c.width=size;c.height=size;c.getContext('2d').drawImage(bmp,x,y,w,h);bmp.close?.();
 return await new Promise(r=>c.toBlob(b=>r(new File([b],'thumb.jpg',{type:'image/jpeg'})),'image/jpeg',.68))
}

function renderTransfer(){$('#selcount').textContent=selected.size+' selezionati';$('#transfer').classList.toggle('show',selected.size>0)}async function move(){const m=[];for(const id of selected){const i=items.find(x=>x.id===id);let q=i.quantita;if(q>1){const a=prompt(`Quanti "${i.nome}" spostare? Disponibili: ${i.quantita}`,q);if(a===null)return;q=parseInt(a)}if(!Number.isInteger(q)||q<1||q>i.quantita)return alert('Quantità non valida');m.push({vestito_id:id,quantita:q})}if(!m.length)return;busy(true);const{error}=await sb.rpc('sposta_capi',{p_movimenti:m,p_destinazione:$('#dest').value});busy(false);if(error)return alert(error.message);selected.clear();await Promise.all([loadHouses(),loadItems(true)]);renderHouse()}
function houseSelect(){$('#itemhouse').innerHTML=houses.map(h=>`<option value="${h.id}">${esc(h.nome)}</option>`).join('')}async function openItem(id){const i=items.find(x=>x.id===id);houseSelect();$('#itemid').value=i?.id||'';$('#itemtitle').textContent=i?'Modifica capo':'Aggiungi capo';$('#name').value=i?.nome||'';$('#brand').value=i?.marca||'';$('#quantity').value=i?.quantita||1;$('#itemhouse').value=i?.casa_id||hid||houses[0]?.id;$('#color').value=i?.colore||'';$('#description').value=i?.descrizione||'';photoPath=i?.foto_path||null;$('#pcamera').value='';$('#plibrary').value='';$('#preview').style.display='none';if(photoPath){const u=await surl(photoPath);if(u){$('#preview').src=u;$('#preview').style.display='block'}}$('#deleteitem').style.display=i?'block':'none';$('#itemdlg').showModal()}
async function uploadImages(f){
 if(!f)return {foto_path:photoPath,thumbnail_path:items.find(x=>x.id===$('#itemid').value)?.thumbnail_path||null};
 const main=await compressImage(f),thumb=await makeThumb(f),id=crypto.randomUUID(),dir=`${user.id}/${id}`,mainPath=`${dir}/photo.jpg`,thumbPath=`${dir}/thumb.jpg`;
 let r=await sb.storage.from('foto-vestiti').upload(mainPath,main,{contentType:'image/jpeg',cacheControl:'31536000'});if(r.error)throw r.error;
 r=await sb.storage.from('foto-vestiti').upload(thumbPath,thumb,{contentType:'image/jpeg',cacheControl:'31536000'});if(r.error){await sb.storage.from('foto-vestiti').remove([mainPath]);throw r.error}

}
$('#itemform').onsubmit=async e=>{e.preventDefault();busy(true);try{const old=items.find(x=>x.id===$('#itemid').value),f=$('#pcamera').files[0]||$('#plibrary').files[0],paths=await uploadImages(f),payload={user_id:user.id,casa_id:$('#itemhouse').value,nome:$('#name').value.trim(),marca:$('#brand').value.trim()||null,quantita:Math.max(1,parseInt($('#quantity').value)||1),colore:$('#color').value.trim()||null,descrizione:$('#description').value.trim()||null,foto_path:paths.foto_path,thumbnail_path:paths.thumbnail_path,updated_at:new Date().toISOString()};let r=old?await sb.from('vestiti').update(payload).eq('id',old.id).select().single():await sb.from('vestiti').insert(payload).select().single();if(r.error)throw r.error;if(f&&old){const rm=[old.foto_path,old.thumbnail_path].filter(Boolean);if(rm.length)await sb.storage.from('foto-vestiti').remove(rm)}$('#itemdlg').close();await Promise.all([loadHouses(),loadItems(true)]);renderHouse()}catch(x){alert(x.message||x)}finally{busy(false)}}
async function addBag(id){const i=items.find(x=>x.id===id);let q=1;if(i.quantita>1){const a=prompt(`Quanti "${i.nome}" in Valigia? Disponibili: ${i.quantita}`,'1');if(a===null)return;q=parseInt(a)}if(!Number.isInteger(q)||q<1||q>i.quantita)return alert('Quantità non valida');const{error}=await sb.rpc('aggiungi_a_valigia',{p_vestito:id,p_quantita:q});alert(error?error.message:'Aggiunto alla Valigia')}

function renderBag(){$('#bagdest').innerHTML=houses.map(h=>`<option value="${h.id}">${esc(h.nome)}</option>`).join('');$('#baglist').innerHTML=bag.length?bag.map(x=>`<div class="card bagrow"><input type="checkbox" data-bs="${x.valigia_id}" ${bsel.has(x.valigia_id)?'checked':''}><div><b>${esc(x.nome)}</b><div class="meta">${esc(x.marca||'Senza marca')} · ${esc(x.casa_nome)} · disp. ${x.quantita_disponibile}</div></div><div class="row"><input type="number" min="1" max="${x.quantita_disponibile}" value="${x.quantita_valigia}" data-bq="${x.valigia_id}"><button class="danger" data-bd="${x.valigia_id}">×</button></div></div>`).join(''):`<div class="empty">Valigia vuota</div>`;document.querySelectorAll('[data-bs]').forEach(c=>c.onchange=()=>{c.checked?bsel.add(c.dataset.bs):bsel.delete(c.dataset.bs);$('#bagsel').textContent=bsel.size+' selezionati'});document.querySelectorAll('[data-bd]').forEach(b=>b.onclick=async()=>{await sb.from('valigia').delete().eq('id',b.dataset.bd);await loadBag(true)});document.querySelectorAll('[data-bq]').forEach(n=>n.onchange=async()=>{const x=bag.find(z=>z.valigia_id===n.dataset.bq),q=parseInt(n.value);if(!Number.isInteger(q)||q<1||q>x.quantita_disponibile){alert('Quantità non valida');return loadBag(true)}const{error}=await sb.rpc('aggiungi_a_valigia',{p_vestito:x.vestito_id,p_quantita:q});if(error)alert(error.message)});$('#bagsel').textContent=bsel.size+' selezionati'}
async function moveBag(){const m=[];for(const id of bsel){const x=bag.find(z=>z.valigia_id===id);if(x.casa_id===$('#bagdest').value)return alert(`${x.nome} è già nella casa scelta`);let q=x.quantita_valigia;if(q>1){const a=prompt(`Quanti "${x.nome}" spostare davvero? Valigia: ${q}, disponibili: ${x.quantita_disponibile}`,q);if(a===null)return;q=parseInt(a)}if(!Number.isInteger(q)||q<1||q>x.quantita_disponibile)return alert('Quantità non valida');m.push({vestito_id:x.vestito_id,quantita:q})}if(!m.length)return;busy(true);const{error}=await sb.rpc('sposta_capi',{p_movimenti:m,p_destinazione:$('#bagdest').value});busy(false);if(error)return alert(error.message);await Promise.all([loadHouses(),loadBag(true)]);alert('Spostamento completato. La Valigia resta una lista indipendente.')}
async function gsearch(reset=true){const q=$('#gsearch').value.trim();if(!q){$('#gres').innerHTML='';$('#gmore').style.display='none';goffset=0;return}if(reset)goffset=0;const{data,error}=await sb.rpc('cerca_vestiti_globale_v21',{p_query:q,p_limit:40,p_offset:goffset});if(error)return;if(reset)$('#gres').innerHTML='';$('#gres').insertAdjacentHTML('beforeend',(data||[]).map(x=>`<button class="card hit" data-gh="${x.casa_id}"><div class="grow"><b>${esc(x.nome)}</b><div class="meta">${esc(x.marca||'Senza marca')} · quantità ${x.quantita} · ${esc(x.casa_nome)}</div></div>›</button>`).join(''));document.querySelectorAll('[data-gh]').forEach(b=>b.onclick=()=>openHouse(b.dataset.gh));goffset+=(data||[]).length;$('#gmore').style.display=(data||[]).length===40?'block':'none'}
async function history(){const{data,error}=await sb.from('trasferimenti').select('batch_id,created_at,da_casa_id,a_casa_id').eq('user_id',user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();if(error)return alert(error.message);lastBatch=data?.batch_id||null;$('#hist').innerHTML=data?`<div class="card" style="padding:11px"><b>${esc(houses.find(h=>h.id===data.da_casa_id)?.nome||'Casa')} → ${esc(houses.find(h=>h.id===data.a_casa_id)?.nome||'Casa')}</b><div class="meta">${new Date(data.created_at).toLocaleString('it-IT')}</div></div>`:'<div class="empty">Nessun trasferimento</div>';$('#undo').style.display=data?'inline-block':'none';$('#histdlg').showModal()}
$('#logout').addEventListener('click',()=>sb.auth.signOut());$('#back').onclick=home;$('#add').onclick=()=>openItem();$('#search').oninput=()=>{clearTimeout(gtimer);gtimer=setTimeout(async()=>{await loadItems(true);renderHouse()},220)};$('#more').onclick=async()=>{await loadItems(false);renderHouse()};$('#selectall').onclick=()=>{const ids=items.map(x=>x.id),a=ids.every(x=>selected.has(x));ids.forEach(x=>a?selected.delete(x):selected.add(x));renderHouse()};$('#move').onclick=move;
$('#camera').onclick=()=>$('#pcamera').click();$('#library').onclick=()=>$('#plibrary').click();function prev(e){const f=e.target.files[0];if(f){$('#preview').src=URL.createObjectURL(f);$('#preview').style.display='block'}}$('#pcamera').onchange=prev;$('#plibrary').onchange=prev;$('#closeitem').onclick=$('#cancelitem').onclick=()=>$('#itemdlg').close();$('#deleteitem').onclick=async()=>{const id=$('#itemid').value;if(!confirm('Eliminare?'))return;const{error}=await sb.from('vestiti').delete().eq('id',id);if(error)return alert(error.message);$('#itemdlg').close();await Promise.all([loadHouses(),loadItems(true)]);renderHouse()};
$('#bagBtn').onclick=async()=>{page('bag');await loadBag(true)};$('#bagback').onclick=home;$('#bagmore').onclick=()=>loadBag(false);$('#clearbag').onclick=async()=>{if(confirm('Svuotare la Valigia?')){await sb.from('valigia').delete().eq('user_id',user.id);await loadBag(true)}};$('#bagmove').onclick=moveBag;$('#gsearch').oninput=()=>{clearTimeout(gtimer);gtimer=setTimeout(()=>gsearch(true),220)};$('#gmore').onclick=()=>gsearch(false);$('#historyBtn').onclick=history;$('#closehist').onclick=()=>$('#histdlg').close();$('#undo').onclick=async()=>{if(!lastBatch)return;busy(true);const{error}=await sb.rpc('annulla_trasferimento_batch',{p_batch:lastBatch});busy(false);if(error)return alert(error.message);$('#histdlg').close();await Promise.all([loadHouses(),loadItems(true)]);renderHouse()};
$('#excelBtn').onclick=()=>$('#excel').click();$('#excel').onchange=async e=>{const f=e.target.files[0];if(!f)return;busy(true);try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});for(const raw of rows){const n={};Object.keys(raw).forEach(k=>n[k.trim().toLowerCase()]=raw[k]);const hn=String(n.casa||'').trim(),nome=String(n['nome capo']||n.nome||'').trim();if(!hn||!nome)continue;let h=houses.find(x=>x.nome.toLowerCase()===hn.toLowerCase());if(!h){const r=await sb.from('case').insert({user_id:user.id,nome:hn,icona:'🏠'}).select().single();if(r.error)throw r.error;h=r.data;houses.push(h)}const r=await sb.from('vestiti').insert({user_id:user.id,casa_id:h.id,nome,marca:String(n.marca||'').trim()||null,quantita:Math.max(1,parseInt(n['quantità']||n.quantita||1)||1),colore:String(n.colore||'').trim()||null,descrizione:String(n.descrizione||n.note||'').trim()||null});if(r.error)throw r.error}await loadHouses();home();alert('Importazione completata')}catch(x){alert(x.message||x)}finally{busy(false)}};
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));init();
</script></body></html>
