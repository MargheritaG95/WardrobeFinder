<script>
const sb=supabase.createClient("https://atupzrgrgojvztbcrlua.supabase.co","sb_publishable_5slDv8ZTohQD_16E2r7pdw_m6jijofi"),$=s=>document.querySelector(s),PAGE=60;let user=null,houses=[],hid=null,items=[],offset=0,hasmore=false,mode='all',opencat=null,catPath=[],catRows=[],pendingFolder=null,selected=new Set(),photoPath=null,gtimer=null,goffset=0,bag=[],boffset=0,bsel=new Set(),lastBatch=null;
const busy=v=>$('#busy').classList.toggle('show',v),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function doLogin(){
 const btn=$('#login'),email=$('#email').value.trim(),password=$('#password').value;
 $('#authmsg').textContent='';
 if(!email||!password){$('#authmsg').textContent='Inserisci email e password.';return}
 btn.disabled=true;btn.textContent='Accesso…';
 try{
   const {data,error}=await sb.auth.signInWithPassword({email,password});
   if(error)throw error;
   if(!data?.session)throw new Error('Accesso non completato.');
   $('#authmsg').textContent='Accesso riuscito.';
   await enter(data.user);
 }catch(err){
   console.error('Login error',err);
   $('#authmsg').textContent='Errore accesso: '+(err?.message||String(err));
 }finally{
   btn.disabled=false;btn.textContent='Accedi';
 }
}
async function doSignup(){
 const btn=$('#signup'),email=$('#email').value.trim(),password=$('#password').value;
 $('#authmsg').textContent='';
 if(!email||!password){$('#authmsg').textContent='Inserisci email e password.';return}
 btn.disabled=true;
 try{
   const {data,error}=await sb.auth.signUp({email,password});
   if(error)throw error;
   $('#authmsg').textContent=data?.session?'Account creato e accesso effettuato.':'Account creato: controlla la tua email.';
   if(data?.session)await enter(data.user);
 }catch(err){
   console.error('Signup error',err);
   $('#authmsg').textContent='Errore: '+(err?.message||String(err));
 }finally{btn.disabled=false}
}
$('#login').addEventListener('click',doLogin);
$('#signup').addEventListener('click',doSignup);
$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
function main(id){['auth','app'].forEach(x=>$('#'+x).classList.toggle('active',x===id))}function page(id){['home','house','bag','stats'].forEach(x=>$('#'+x).classList.toggle('active',x===id))}

async function init(){
 try{
  const {data:{session},error}=await sb.auth.getSession();
  if(error)throw error;
  if(session)await enter(session.user);else main('auth');
  sb.auth.onAuthStateChange(async(_,s)=>{try{if(s?.user&&!user)await enter(s.user);if(!s){user=null;main('auth')}}catch(err){console.error('Auth state error',err)}})
 }catch(err){console.error('Init error',err);main('auth');$('#authmsg').textContent='Errore inizializzazione: '+(err?.message||String(err))}
}
async function enter(u){
 user=u;$('#user').textContent=u.email||'';main('app');
 try{await loadHouses();home()}catch(err){console.error('Enter error',err);alert('Accesso riuscito, ma errore nel caricamento: '+(err?.message||String(err)))}
}
async function loadHouses(){const {data,error}=await sb.rpc('lista_case_con_conteggi');if(error)throw error;houses=data||[]}
function home(){
 page('home');hid=null;selected.clear();
 $('#houses').innerHTML=houses.map(h=>`<button class="card house" data-h="${h.id}"><div><div class="ico" id="hi-${h.id}">${h.foto_path?'…':esc(h.icona||'🏠')}</div><div class="name">${esc(h.nome)}</div></div><div class="muted">${h.totale||0} pezzi</div></button>`).join('')+`<button id="newhouse" class="card house new"><b>＋ Aggiungi casa</b></button>`;
 document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>openHouse(b.dataset.h));$('#newhouse').onclick=addHouse;
 houses.filter(h=>h.foto_path).forEach(h=>surl(h.foto_path).then(u=>{const e=$('#hi-'+h.id);if(e&&u)e.innerHTML=`<img src="${u}" loading="lazy">`}))
}
async function addHouse(){const nome=(prompt('Nome casa:')||'').trim();if(!nome)return;const icona=(prompt('Emoji casa:','🏠')||'🏠').trim();const {error}=await sb.from('case').insert({user_id:user.id,nome,icona});if(error)return alert(error.message);await loadHouses();home()}

const signedCache=new Map();
async function surl(p){
 if(!p)return null;
 if(signedCache.has(p))return signedCache.get(p);
 const {data}=await sb.storage.from('foto-vestiti').createSignedUrl(p,86400);
 const u=data?.signedUrl||null;if(u)signedCache.set(p,u);return u
}
function lazyPhotos(){
 const imgs=[...document.querySelectorAll('img[data-photo]')];
 if(!('IntersectionObserver'in window)){imgs.forEach(loadLazy);return}
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){loadLazy(e.target);io.unobserve(e.target)}}),{rootMargin:'250px'});
 imgs.forEach(i=>io.observe(i))
}
async function loadLazy(img){if(img.dataset.loaded)return;img.dataset.loaded='1';const u=await surl(img.dataset.photo);if(u){img.src=u;img.onload=()=>img.classList.add('loaded')}}
async function compressImage(file,max=1600,quality=.78){
 if(!file||!file.type.startsWith('image/'))return file;
 const bmp=await createImageBitmap(file),scale=Math.min(1,max/Math.max(bmp.width,bmp.height)),w=Math.max(1,Math.round(bmp.width*scale)),h=Math.max(1,Math.round(bmp.height*scale));
 const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);bmp.close?.();
 return await new Promise(r=>c.toBlob(b=>r(new File([b],(file.name.replace(/\.[^.]+$/,'')||'foto')+'.jpg',{type:'image/jpeg'})),'image/jpeg',quality))
}
async function makeThumb(file){
 const bmp=await createImageBitmap(file),size=320,scale=Math.max(size/bmp.width,size/bmp.height),w=bmp.width*scale,h=bmp.height*scale,x=(size-w)/2,y=(size-h)/2;
 const c=document.createElement('canvas');c.width=size;c.height=size;c.getContext('2d').drawImage(bmp,x,y,w,h);bmp.close?.();
 return await new Promise(r=>c.toBlob(b=>r(new File([b],'thumb.jpg',{type:'image/jpeg'})),'image/jpeg',.68))
}
function icon(n){n=(n||'').toLowerCase();if(n.includes('magli')||n.includes('t-shirt'))return'👕';if(n.includes('camic'))return'👔';if(n.includes('pantal')||n.includes('jeans'))return'👖';if(n.includes('scar'))return'👟';if(n.includes('vestit')||n.includes('abito'))return'👗';if(n.includes('giacc')||n.includes('cappott'))return'🧥';if(n.includes('calz'))return'🧦';if(n.includes('bors'))return'👜';if(n.includes('intim'))return'🩲';return'📁'}
async function cats(){
 const {data,error}=await sb.rpc('categorie_casa',{p_casa:hid});if(error)throw error;
 catRows=(data||[]).map(x=>({categoria:(x.categoria&&String(x.categoria).trim())||'Senza categoria',totale:Number(x.totale)||0}));
 $('#catfilter').innerHTML='<option value="">Tutte le categorie</option>'+catRows.map(x=>`<option value="${esc(x.categoria)}">${esc(x.categoria)}</option>`).join('');
 renderCatGrid()
}
function catTree(rows){
 const root={children:{},count:0,itemsHere:0,full:''};
 rows.forEach(r=>{
  const segs=r.categoria.split('/').map(s=>s.trim()).filter(Boolean);
  if(!segs.length)segs.push('Senza categoria');
  let node=root;
  segs.forEach((seg,idx)=>{
   if(!node.children[seg])node.children[seg]={children:{},count:0,itemsHere:0,full:segs.slice(0,idx+1).join('/')};
   node=node.children[seg];
   node.count+=r.totale
  });
  node.itemsHere+=r.totale
 });
 return root
}
function renderCatGrid(){
 const root=catTree(catRows);
 let node=root;
 for(const seg of catPath){const n=node?.children?.[seg];if(!n){catPath=[];node=root;break}node=n}
 $('#catcrumbs').innerHTML=catPath.length?['<button data-cp="-1">📁 Categorie</button>'].concat(catPath.map((seg,i)=>`<button data-cp="${i}">${esc(seg)}</button>`)).join(' › '):'';
 const tiles=[];
 if(catPath.length&&node.itemsHere>0)tiles.push(`<button class="card cat" data-c="${esc(node.full)}"><div class="folder">📄</div><b>Capi qui</b><div class="muted">${node.itemsHere} pezzi</div></button>`);
 Object.entries(node.children||{}).forEach(([name,child])=>{
  const hasChildren=Object.keys(child.children).length>0;
  tiles.push(hasChildren
   ?`<button class="card cat" data-f="${esc(name)}"><div class="folder">📁</div><b>${esc(name)}</b><div class="muted">${child.count} pezzi</div></button>`
   :`<button class="card cat" data-c="${esc(child.full)}"><div class="folder">${icon(name)}</div><b>${esc(name)}</b><div class="muted">${child.count} pezzi</div></button>`)

async function exportBackup(){
 busy(true);
 try{
  const [hr,ir,br]=await Promise.all([
   sb.from('case').select('*').eq('user_id',user.id),
   sb.from('vestiti').select('*').eq('user_id',user.id),
   sb.from('valigia').select('*').eq('user_id',user.id)
  ]);
  if(hr.error)throw hr.error;if(ir.error)throw ir.error;if(br.error)throw br.error;
  const allHouses=hr.data||[],allItems=ir.data||[],allBag=br.data||[];
  const zip=new JSZip(),photos=zip.folder('foto'),paths=new Set();
  allHouses.forEach(h=>{if(h.foto_path)paths.add(h.foto_path)});
  allItems.forEach(i=>{if(i.foto_path)paths.add(i.foto_path);if(i.thumbnail_path)paths.add(i.thumbnail_path)});
  for(const p of paths){
   try{const{data,error}=await sb.storage.from('foto-vestiti').download(p);if(!error&&data)photos.file(p,data)}catch(_){}
  }
  zip.file('dati.json',JSON.stringify({app:'WardrobeFinder',formato:1,esportato_il:new Date().toISOString(),utente:user.email||null,case:allHouses,vestiti:allItems,valigia:allBag},null,2));
  const blob=await zip.generateAsync({type:'blob'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`guardaroba-backup-${new Date().toISOString().slice(0,10)}.zip`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
 }catch(err){alert('Errore backup: '+(err?.message||String(err)))}finally{busy(false)}
}
async function restorePhoto(zip,oldPath){
 if(!oldPath)return null;
 const entry=zip.file('foto/'+oldPath);if(!entry)return null;
 try{
  const blob=await entry.async('blob'),name=oldPath.split('/').pop()||'foto.jpg',newPath=`${user.id}/${crypto.randomUUID()}/${name}`;
  const{error}=await sb.storage.from('foto-vestiti').upload(newPath,blob,{contentType:blob.type||'image/jpeg',cacheControl:'31536000'});
  if(error)return null;
  return newPath
 }catch(_){return null}
}
async function importBackup(file){
 if(!confirm('Verranno aggiunti i dati e le foto del file di backup a quelli già presenti: nessun dato esistente verrà cancellato o sovrascritto. Continuare?'))return;
 busy(true);
 try{
  const zip=await JSZip.loadAsync(file),mf=zip.file('dati.json');
  if(!mf)throw new Error('File di backup non valido: manca dati.json.');
  const manifest=JSON.parse(await mf.async('string')),backupHouses=manifest.case||[],backupItems=manifest.vestiti||[],backupBag=manifest.valigia||[];
  const houseIdMap={},itemIdMap={};
  for(const h of backupHouses){
   let target=houses.find(x=>String(x.nome||'').trim().toLowerCase()===String(h.nome||'').trim().toLowerCase());
   if(!target){
    const fotoPath=h.foto_path?await restorePhoto(zip,h.foto_path):null;
    const{data,error}=await sb.from('case').insert({user_id:user.id,nome:h.nome,icona:h.icona||'🏠',foto_path:fotoPath}).select().single();
    if(error)throw error;
    target=data;houses.push(target)
   }
   houseIdMap[h.id]=target.id
  }
  for(const it of backupItems){
   const casaId=houseIdMap[it.casa_id];if(!casaId)continue;
   const fotoPath=it.foto_path?await restorePhoto(zip,it.foto_path):null,thumbPath=it.thumbnail_path?await restorePhoto(zip,it.thumbnail_path):null;
   const{data,error}=await upsertVestito({user_id:user.id,casa_id:casaId,nome:it.nome,marca:it.marca||null,categoria:it.categoria||null,quantita:it.quantita||1,colore:it.colore||null,calore:it.calore??null,descrizione:it.descrizione||null,foto_path:fotoPath,thumbnail_path:thumbPath});
   if(error)throw error;
   itemIdMap[it.id]=data.id
  }
  for(const b of backupBag){
   const newItemId=itemIdMap[b.vestito_id];if(!newItemId)continue;
   const qty=b.quantita_valigia||b.quantita||1;
   try{await sb.rpc('aggiungi_a_valigia',{p_vestito:newItemId,p_quantita:qty})}catch(_){}
  }
  await loadHouses();home();
  alert(`Ripristino completato: ${backupHouses.length} case e ${backupItems.length} capi elaborati (nessun dato precedente è stato modificato o cancellato).`)
 }catch(err){alert('Errore ripristino: '+(err?.message||String(err)))}finally{busy(false)}
}
